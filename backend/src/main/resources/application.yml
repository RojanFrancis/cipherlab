spring:
  application:
    name: cipherlab
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cipherlab}
    username: ${DB_USERNAME:cipherlab}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8080
  shutdown: graceful

cipherlab:
  security:
    # HS256 signing secret for access tokens. NO default here on purpose:
    # a publicly known default secret in the base profile is indistinguishable
    # from no authentication at all. The app refuses to boot when this is
    # missing, blank, shorter than 32 chars, or equal to the well-known
    # development value outside the `dev` profile (see JwtService).
    # Deployments must set JWT_SECRET (min 32 chars, randomly generated).
    jwt-secret: ${JWT_SECRET:}
    # Issuer claim written into every token and validated on every request.
    jwt-issuer: ${JWT_ISSUER:cipherlab-api}
    jwt-ttl-seconds: ${JWT_TTL_SECONDS:3600}
    # Only the `dev` profile may set this to true (development defaults).
    allow-dev-secret: ${ALLOW_DEV_JWT_SECRET:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
