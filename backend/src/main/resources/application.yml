spring:
  application:
    name: cipherlab
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cipherlab}
    username: ${DB_USERNAME:cipherlab}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never