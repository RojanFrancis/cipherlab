name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref — a push storm should not queue
# twenty builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven / Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Tests run against H2 in PostgreSQL compatibility mode (the `dev`
      # profile), so no container is needed here — the PostgreSQL path is
      # exercised by the compose file locally. See docs/architecture.md.
      - name: Run backend tests
        working-directory: backend
        run: ./mvnw -B clean test

      - name: Package the application
        working-directory: backend
        run: ./mvnw -B -DskipTests package

  frontend:
    name: Frontend (TypeScript / Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` — reproducible install from the lockfile, never `npm i`.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Web Crypto unit tests for the messaging E2EE layer (vitest):
      # handshake signatures, directional keys, HKDF separation, AAD, tampering.
      - name: Frontend tests
        working-directory: frontend
        run: npm test

      # `npm run build` runs `tsc -b` first, so a type error fails the job
      # before Vite ever bundles.
      - name: Type-check and build
        working-directory: frontend
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
