services:
  db:
    image: postgres:17
    container_name: cipherlab-db
    environment:
      POSTGRES_DB: cipherlab
      POSTGRES_USER: cipherlab
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - cipherlab_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cipherlab -d cipherlab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cipherlab_data: